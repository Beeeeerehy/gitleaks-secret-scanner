name: Gitleaks Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Repository snapshot to scan
        type: choice
        required: true
        default: own-repository
        options:
          - own-repository
          - tests-before-fix
          - tests-after-fix

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout the tests project snapshot
        if: ${{ inputs.target == 'tests-before-fix' || inputs.target == 'tests-after-fix' }}
        uses: actions/checkout@v6
        with:
          repository: RafikHamza/tests
          ref: ${{ inputs.target == 'tests-after-fix' && '65706937738a63cbe9e9ea520c19ca30da069ab6' || 'a1bb4fccd5ba3a5c2ba07e76adbc9a8ae031a27b' }}
          path: tests-target
          persist-credentials: false

      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          mkdir -p gitleaks
          cd gitleaks
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the selected repository with Gitleaks
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          target_dir="$GITHUB_WORKSPACE"
          if [[ "$TARGET" == tests-before-fix || "$TARGET" == tests-after-fix ]]; then
            target_dir="$GITHUB_WORKSPACE/tests-target"
          fi
          printf 'Scan target: %s\n' "${TARGET:-own-repository}"
          git -C "$target_dir" log -1 --format='Snapshot: %H'

          snapshot="$(mktemp -d "$RUNNER_TEMP/gitleaks-snapshot.XXXXXX")"
          git -C "$target_dir" archive HEAD | tar -x -C "$snapshot"
          cd "$snapshot"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-banner --redact=100 --verbose .
          
